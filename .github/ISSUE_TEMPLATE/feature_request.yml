name: ⭐ Feature request
description: Suggest a new feature or improvement for REX Player
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature proposal
      description: A clear and concise description of what you want added to REX Player.
      placeholder: |
        Describe the feature and how it should work.
        Example: "Add gesture support to quickly switch audio tracks during playback..."
    validations:
      required: true

  - type: textarea
    id: problem-context
    attributes:
      label: Problem or use case
      description: What problem does this solve, or what is the intended use case?
      placeholder: |
        Example: "Currently, doing this requires opening the settings sheet each time..."

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution or workflow
      description: How do you envision this working from a user perspective?
      placeholder: |
        Describe UI placement, gestures, or configuration options.

  - type: textarea
    id: other-details
    attributes:
      label: Additional context or mockups
      placeholder: |
        Attach UI mockups, screenshots, reference player behaviors, or extra notes.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Please verify each item below before submitting.
      options:
        - label: I have searched existing issues and verified this is **NOT** a duplicate or already requested.
          required: true
        - label: I have written a clear and descriptive issue title.
          required: true
        - label: I verified that this feature does not already exist in the latest release **[5.1.0](https://github.com/mpvRex/REX-Player/releases/latest)** or preview build.
          required: true
        - label: I have completed all relevant fields in this form.
          required: true
